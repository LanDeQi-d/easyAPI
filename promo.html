<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>easy · 让想法成为作品 · HTML宣传片</title><style>*{box-sizing:border-box}body{margin:0;background:#07121c;color:#eaf5f6;font-family:'Segoe UI','Microsoft YaHei',sans-serif;overflow:hidden}#stage{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:8vw;position:relative;background:radial-gradient(ellipse at 80% 30%,#24615f66,transparent 60%),radial-gradient(ellipse at 15% 90%,#34467877,transparent 60%)}.orb{position:absolute;width:40vw;height:40vw;right:-8vw;top:-8vw;border:1px solid #82dfbd22;border-radius:50%;box-shadow:0 0 0 70px #82dfbd08,0 0 0 140px #82dfbd04;animation:float 12s infinite alternate;pointer-events:none}@keyframes float{to{transform:translate(-8vw,12vh) rotate(30deg)}}#brand{font-size:18px;letter-spacing:7px;color:#9ed9c7}#title{font-size:clamp(38px,6vw,90px);line-height:1.2;letter-spacing:-2px;max-width:85%;margin:28px 0}#features{font-size:clamp(18px,2vw,30px);color:#9adbc6}#description{font-size:15px;line-height:1.8;color:#9aafbf;max-width:700px}#counter{position:absolute;top:40px;right:45px;font-size:14px;color:#8da4b5}#caption{position:absolute;bottom:110px;font-size:12px;color:#7b92a3}footer{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:22px 5vw;background:#08101cbb}button,a{color:#eaf6f1;background:#263d45;border:1px solid #5e7c82;border-radius:25px;padding:10px 18px;text-decoration:none;font-size:14px;cursor:pointer}input{flex:1;accent-color:#9ed9c7}.enter{animation:enter .8s both}@keyframes enter{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><div id="stage"><div class="orb"></div><div id="counter"></div><span id="brand"></span><h1 id="title"></h1><p id="features"></p><p id="description"></p><small id="caption">HTML动效宣传片 · 功能文案展示，不是实时任务执行录像 · 无需联网播放</small></div><footer><button id="play">播放</button><button id="prev">上一幕</button><input id="seek" type="range" min="0" max="60" step=".1" value="0"><button id="next">下一幕</button><button id="full">全屏</button><a href="https://landeqi-d.github.io/easyAPI/" target="_blank" rel="noopener">访问官网 ↗</a></footer><script>const slides=[["把想法，交给一支团队。", "Super AI work", "3～10个API协作 · 老板分工 · 测试反馈 · 工作层制作", "API平台与 easy Code 的多模型工作流；静态审查会明确标注，实际运行须使用编程工具。"], ["聊下去，工作不断档。", "easy Code 1.1", "会话列表 · 本地记录 · 新建与切换", "任务、终端和结果仍在同一工作界面。对话可以在本机保存和删除。"], ["文档和灵感，都有地方安放。", "easy WPS", "Word · Excel · PPT · Markdown · PDF · 图片", "支持基本编辑、另存副本与图片处理；复杂 Office 排版不是本版支持范围。"], ["让片段，连成你的故事。", "easy Cut", "入点与出点 · 时间线拼接 · 倍速 · 音轨", "真实 FFmpeg 编码导出720p MP4，保留原素材。"], ["开始你的下一件事。", "easy 应用家族", "Windows 10 / 11 x64 · 默认安装 D盘", "使用自己的API；本地文件保存在你选择的目录。"]];let time=0,playing=false,last=0,index=-1;const $=id=>document.getElementById(id);function render(){const i=Math.min(4,Math.floor(time/12));if(i!==index){index=i;const s=slides[i];['title','brand','features','description'].forEach((id,j)=>{$(id).textContent=s[j];$(id).classList.remove('enter');void $(id).offsetWidth;$(id).classList.add('enter')})}$('seek').value=time;$('counter').textContent=(i+1)+' / 5 · '+Math.floor(time)+'s / 60s';$('play').textContent=playing?'暂停':'播放'}function frame(now){if(playing){time+=Math.min(.1,(now-last)/1000);if(time>=60){time=60;playing=false}render()}last=now;requestAnimationFrame(frame)}$('play').onclick=()=>{if(time>=60)time=0;playing=!playing;render()};$('seek').oninput=e=>{time=Number(e.target.value);render()};$('prev').onclick=()=>{time=Math.max(0,(index-1)*12);render()};$('next').onclick=()=>{time=Math.min(59,(index+1)*12);render()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.onkeydown=e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();$('play').click()}};render();requestAnimationFrame(frame);</script></html>
